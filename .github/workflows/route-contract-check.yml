name: Route Contract Check

# Non-blocking, scheduled check for frontend-URL <-> server-route drift
# (see scripts/check-route-contract.ts for the full rationale). This is
# deliberately NOT wired into ci.yml / pull_request triggers: cross-repo
# checkout of aexa-server adds a failure mode that has nothing to do with
# any given frontend PR's diff, so it runs on its own cadence instead of
# gating merges.
#
# SETUP REQUIRED BEFORE THIS WORKFLOW CAN RUN:
# aexa-server is a PRIVATE repo, and the default GITHUB_TOKEN does not grant
# read access to other repos (even same-org ones) -- so an anonymous
# `git clone` of it will fail with an auth error. This workflow needs a
# `CROSS_REPO_PAT` repository secret: a fine-grained Personal Access Token
# with read-only access to Qiyrix/aexa-server, created manually by a repo
# admin (Settings > Developer settings > Fine-grained tokens) and added
# under aexa-frontend's Settings > Secrets and variables > Actions. This
# cannot be automated/created by an agent -- it must be set up by hand in
# GitHub's UI before the scheduled run (or a manual workflow_dispatch) will
# succeed.
#
# On failure, this workflow posts to the #ci-alerts Slack channel via a
# `SLACK_WEBHOOK_URL` repository secret (a Slack Incoming Webhook), same
# manual-setup requirement as CROSS_REPO_PAT above.

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 09:00 UTC.
    - cron: '0 9 * * 1'

jobs:
  check-route-contract:
    name: Check frontend/server route contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout aexa-frontend
        uses: actions/checkout@v4
        with:
          path: aexa-frontend

      - name: Shallow-clone aexa-server
        # Requires the CROSS_REPO_PAT secret described above -- aexa-server
        # is private, so an unauthenticated clone will fail here otherwise.
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ secrets.CROSS_REPO_PAT }}@github.com/Qiyrix/aexa-server" \
            aexa-server

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aexa-frontend/package-lock.json

      - name: Install dependencies
        working-directory: aexa-frontend
        run: npm ci

      - name: Run route contract check
        working-directory: aexa-frontend
        env:
          AEXA_SERVER_PATH: ${{ github.workspace }}/aexa-server
        run: npm run check:routes

      - name: Notify Slack on failure
        if: failure()
        run: |
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\":rotating_light: Route contract check failed on aexa-frontend main. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}" \
            "${{ secrets.SLACK_WEBHOOK_URL }}"
